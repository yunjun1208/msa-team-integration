name: team-msa-local
x-app: &app
  restart: unless-stopped
  env_file: .env.local
  environment: &env
    SERVER_PORT: 80
    DB_HOST: mysql
    SPRING_DATASOURCE_USERNAME: admin
    SPRING_JPA_SHOW_SQL: "false"
    AWS_EC2_METADATA_DISABLED: "true"
  depends_on:
    mysql:
      condition: service_healthy
services:
  mysql:
    image: mysql:8.4
    env_file: .env.local
    environment:
      MYSQL_DATABASE: ordermsa
      MYSQL_USER: admin
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u admin -D ordermsa -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 40
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    env_file: .env.local
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - image-data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file: .env.local
    depends_on: [minio]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing local/products
        mc anonymous set download local/products
  member-service:
    <<: *app
    build:
      context: .
      dockerfile: local/Dockerfile.java
      args: {SERVICE: member}
    environment:
      <<: *env
      APP_AUTH_COOKIE_SECURE: "false"
  product-service:
    <<: *app
    build:
      context: .
      dockerfile: local/Dockerfile.java
      args: {SERVICE: product}
    environment:
      <<: *env
      S3_BUCKET_NAME: products
      CLOUD_AWS_S3_ENDPOINT: http://minio:9000
      CLOUD_AWS_S3_PUBLIC_BASE_URL: http://localhost:9000/products
    depends_on:
      mysql: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  ordering-service:
    <<: *app
    build:
      context: .
      dockerfile: local/Dockerfile.java
      args: {SERVICE: ordering}
    environment:
      <<: *env
      ORDER_NOTIFICATIONS_ENABLED: "false"
      PRODUCT_SERVICE_URL: http://product-service
      MEMBER_SERVICE_URL: http://member-service
  apigateway-service:
    <<: *app
    build:
      context: .
      dockerfile: local/Dockerfile.java
      args: {SERVICE: apigateway}
    depends_on: [member-service, product-service, ordering-service]
  frontend:
    build: app/msa/frontend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [apigateway-service]
volumes:
  mysql-data:
  image-data:
