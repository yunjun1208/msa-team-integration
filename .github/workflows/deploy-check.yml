name: Verify approved deployment
on:
  push:
    branches: [main]
    paths: ['app/msa/kustomization.yaml', 'deploy/release.json']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: verify-deployment
  cancel-in-progress: true
jobs:
  verify:
    # AWS 환경 재구축·조회 역할 준비 후 설정합니다. test2에서는 절대 AWS 인증하지 않습니다.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY_CHECKS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_CHECK_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '256187519952'
      - name: Verify version and function inside VPC
        env:
          VERIFY_CODEBUILD_PROJECT: Final-deploy-verify
          VERIFY_SOURCE_BUCKET: final-deploy-verify-256187519952-ap-northeast-2
        run: python3 -u scripts/ops/run_private_verify.py
      - if: failure()
        run: echo '배포 확인 실패. 이전 정상 release를 확인하고 rollback_release.py로 복구 PR을 작성하세요.' >> "$GITHUB_STEP_SUMMARY"
